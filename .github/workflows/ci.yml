name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or PR cancels the run that's still going, so minutes aren't spent twice.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Typecheck, tests, secret scan and audit on both systems. A stuck job fails instead of hanging for hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 19 Oct 2026.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm secrets
      - run: pnpm audit --audit-level high
