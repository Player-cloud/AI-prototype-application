name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm secrets
      - run: pnpm audit --audit-level high

  shell:
    # The Rust window shell: builds and runs its tests on both systems.
    # A stuck job now fails after 25 minutes instead of hanging for hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        # Since 2026-11-11 every package download here stalls for 20s and is skipped (index downloads
        # still work), on both the runner's mirror and the main Ubuntu archive. A stall of exactly
        # 20s per file points at IPv6, so apt is forced onto IPv4. The two curl lines print which one
        # works, to help if it happens again. No man-page index rebuild, download retries, never
        # waits for an answer, and the step fails after 10 minutes instead of hanging.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt; fi
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          curl -4 -sS -o /dev/null -m 15 -w 'IPv4 download test: %{http_code} in %{time_total}s\n' http://archive.ubuntu.com/ubuntu/pool/main/b/bzip2/ || true
          curl -6 -sS -o /dev/null -m 15 -w 'IPv6 download test: %{http_code} in %{time_total}s\n' http://archive.ubuntu.com/ubuntu/pool/main/b/bzip2/ || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libgtk-3-dev libdbus-1-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
