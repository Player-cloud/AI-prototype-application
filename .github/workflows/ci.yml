name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm secrets
      - run: pnpm audit --audit-level high

  shell:
    # The Rust window shell: builds and runs its tests on both systems.
    # A stuck job now fails after 25 minutes instead of hanging for hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # ubuntu-latest is now Ubuntu 26.04, whose apt mirror stalls on every package download (each
    # one waits 20s and is skipped), so the install never finishes. The window libraries are
    # installed on Ubuntu 24.04 instead; the check keeps its name so nothing else changes.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        # Faster and safer installs: no man-page index rebuild, download retries, never waits for an
        # answer. If it still sticks, the step fails after 10 minutes and can be re-run.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libgtk-3-dev libdbus-1-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
