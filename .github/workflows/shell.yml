name: shell

# The Rust window shell: builds and runs its tests on both systems. Runs only when the shell changes,
# because it is the slowest job and Windows minutes count double.
on:
  pull_request:
    paths:
      - 'apps/desktop/src-tauri/**'
      - '.github/workflows/shell.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/src-tauri/**'
      - '.github/workflows/shell.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        # On 11 Nov package downloads stalled here for ~50 minutes. Now: IPv4 only (the stalls looked
        # like IPv6 timeouts), retries, no man-page rebuild, and the step fails after 10 minutes.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null || true
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libgtk-3-dev libdbus-1-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
