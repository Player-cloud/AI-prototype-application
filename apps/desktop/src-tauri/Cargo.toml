[package]
name = "ai-prototype"
version = "0.0.1"
description = "AI-prototype-application desktop shell"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ai_prototype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
