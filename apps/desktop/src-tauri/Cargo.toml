[package]
name = "ai-prototype"
version = "0.0.1"
description = "AI-prototype-application desktop shell"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ai_prototype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# API keys live in the system's own password store: Credential Manager on Windows,
# the Secret Service keyring (GNOME Keyring / KWallet) on Linux. Never in a file.
keyring = { version = "3.6.3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
